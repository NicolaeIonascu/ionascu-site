server {
    listen 80;
    server_name ionascu.com www.ionascu.com;
    return 301 https://ionascu.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.ionascu.com;
    ssl_certificate /etc/letsencrypt/live/ionascu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ionascu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://ionascu.com$request_uri;
}

server {
    listen 443 ssl;
    server_name ionascu.com;
    root /var/www/ionascu-static/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/ionascu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ionascu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/ionascu-access.log;
    error_log /var/log/nginx/ionascu-error.log;
    error_page 404 /404.html;
    include /etc/nginx/snippets/ionascu-redirects.conf;

    # The CRM's client-side login is not access control.
    location = /crm { return 404; }
    location ^~ /crm/ { return 404; }
    location ~ /\. { deny all; }
    location ~ \.php(?:/|$) { return 404; }
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
